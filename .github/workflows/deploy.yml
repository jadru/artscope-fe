name: CI/CD

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io
  DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
  AWS_CODE_DEPLOY_NAME: artscope-codedeploy
  AWS_CODE_DEPLOY_GROUP: artscope-codedeploy-frontend

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: core
            pattern: packages/core/**
            image-prod: jadru/artplatform-fe
            image-dev: jadru/artplatform-fe
            dockerfile: ./docker/core/core.Dockerfile
          - package: admin
            pattern: packages/admin/**
            image-prod: jadru/artscope-admin
            image-dev: jadru/artscope-admin
            dockerfile: ./docker/admin/admin.Dockerfile
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Check if affected
        id: diff
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            ${{ matrix.pattern }}
          FILES: |
            package.json
            yarn.lock
            tsconfig.base.json
            .eslintrc

      - name: Set branch-based environment variables
        if: steps.diff.outputs.diff
        uses: iamtheyammer/branch-env-vars@v1.1.3
        with:
          IMAGE_REPO: |
            main:${{ matrix.image-prod }}
            develop:${{ matrix.image-dev }}
          DOCKERFILE: |
            ${{ matrix.dockerfile }}

      - name: Copy env from secrets
        if: steps.diff.outputs.diff
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo ${{ secrets.ENV_PROD }} > .env
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
           echo ${{ secrets.ENV_DEV }} > .env
          fi

      - name: Setup Docker buildx
        if: steps.diff.outputs.diff
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.diff.outputs.diff
        run: echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$DOCKER_REGISTRY_USERNAME" --password-stdin

      - name: Extract Docker metadata
        if: steps.diff.outputs.diff
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=ref,event=branch,prefix=${{ secrets.MAJOR }}.${{ secrets.MINOR }}

      - name: Build and Push Docker image
        id: build-and-push
        if: steps.diff.outputs.diff
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: ${{ env.DOCKERFILE }}
          tags:  ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write Docker image name to file
        if: steps.diff.outputs.diff
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }}" > fe-image.txt
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tags }}" > fe-image-dev.txt
          fi

      - name: Create zip file for AWS CodeDeploy
        if: steps.diff.outputs.diff
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            mkdir ${{ env.AWS_CODE_DEPLOY_NAME }} && cp -r appspec.yml fe-image.txt scripts ${{ env.AWS_CODE_DEPLOY_NAME }}
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            mkdir ${{ env.AWS_CODE_DEPLOY_NAME }} && cp -r appspec-dev.yml fe-image-dev.txt scripts ${{ env.AWS_CODE_DEPLOY_NAME }}
          fi

      - name: Rename appspec-dev file to appspec
        if: steps.diff.outputs.diff && github.ref == 'refs/heads/develop'
        run: |
          cd ${{ env.AWS_CODE_DEPLOY_NAME }} && mv appspec-dev.yml appspec.yml

      - name: AWS Configure
        if: steps.diff.outputs.diff
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: Upload to AWS S3
        if: steps.diff.outputs.diff
        run: |
          aws deploy push \
          --application-name ${{ env.AWS_CODE_DEPLOY_NAME }} \
          --s3-location s3://${{ env.AWS_S3_BUCKET_NAME }}/codedeploy/$GITHUB_SHA.zip \
          --ignore-hidden-files \
          --source ${{ env.AWS_CODE_DEPLOY_NAME }}

      - name: Delpoy to AWS EC2
        if: steps.diff.outputs.diff
        run: |
          aws deploy create-deployment \
          --application-name ${{ env.AWS_CODE_DEPLOY_NAME }} \
          --deployment-config-name CodeDeployDefault.OneAtATime \
          --deployment-group-name ${{ env.AWS_CODE_DEPLOY_GROUP }} \
          --description "Deploy artscope frontend" \
          --s3-location bucket=$AWS_S3_BUCKET_NAME,key=codedeploy/$GITHUB_SHA.zip,bundleType=zip

      - name: Autoincrement a new minor version
        if: steps.diff.outputs.diff
        run: |
          echo "NEW_MINOR_VERSION=$((${{ secrets.MINOR }}+1))" >> $GITHUB_ENV

      - name: Update Minor version
        if: steps.diff.outputs.diff
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: 'MINOR'
          value: ${{ env.NEW_MINOR_VERSION }}
          repository: ${{ secrets.REPO }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
