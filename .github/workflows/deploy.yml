name: Docker Image CI for Production w/ AWS CodeDeploy

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: docker.io
  DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
  AWS_CODE_DEPLOY_NAME: artscope-codedeploy
  AWS_CODE_DEPLOY_GROUP: artscope-codedeploy-frontend

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: core
            pattern: packages/core/**
            image-prod: jadru/artplatform-fe
            image-dev: jadru/artplatform-fe
            dockerfile-prod: ./docker/core/Dockerfile.prod
            dockerfile-dev: ./docker/core/Dockerfile.dev
          - package: admin
            pattern: packages/admin/**
            image-prod: jadru/artscope-admin
            image-dev: jadru/artscope-admin
            dockerfile-prod: ./docker/admin/Dockerfile.prod
            dockerfile-dev: ./docker/admin/Dockerfile.dev
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if affected
        id: diff
        uses: technote-space/get-diff-action@v6.1.0
        with:
          PATTERNS: |
            ${{ matrix.pattern }}

      - name: Set branch-based environment variables
        if: steps.diff.outputs.diff
        uses: iamtheyammer/branch-env-vars@v1.1.3
        with:
          IMAGE_REPO: |
            main:${{ matrix.image-prod }}
            dev:${{ matrix.image-dev }}
          DOCKERFILE: |
            main:${{ matrix.dockerfile-prod }}
            dev:${{ matrix.dockerfile-dev }}
      - name: Copy env from secrets
        if: steps.diff.outputs.diff
        run: |
          main: echo ${{ secrets.ENV_PROD }} > .env
          dev: echo ${{ secrets.ENV_DEV }} > .env

      - name: Setup Docker buildx
        if: steps.diff.outputs.diff
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.diff.outputs.diff
        run: echo "$DOCKER_REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$DOCKER_REGISTRY_USERNAME" --password-stdin

      - name: Extract Docker metadata
        if: steps.diff.outputs.diff
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ IMAGE_REPO }}
          tags: |
            main: ${{ secrets.MAJOR }}.${{ secrets.MINOR }}
            dev: ${{ secrets.MAJOR }}.${{ secrets.MINOR }}.dev

      - name: Build and Push Docker image
        id: build-and-push
        if: steps.diff.outputs.diff
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          file: ${{ env.DOCKERFILE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write Docker image name to file
        if: steps.diff.outputs.diff
        run: |
          main: echo "${{ env.IMAGE_NAME }}:${{ secrets.MAJOR }}.${{ secrets.MINOR }}" > fe-image.txt
          dev: echo "${{ env.IMAGE_NAME }}:${{ secrets.MAJOR }}.${{ secrets.MINOR }}.dev" > fe-image-dev.txt

      - name: Create zip file for AWS CodeDeploy
        if: steps.diff.outputs.diff
        run: |
          main: mkdir ${{ env.AWS_CODE_DEPLOY_NAME }} && cp -r appspec.yml fe-image.txt scripts ${{ env.AWS_CODE_DEPLOY_NAME }}
          dev: mkdir ${{ env.AWS_CODE_DEPLOY_NAME }} && cp -r appspec-dev.yml fe-image-dev.txt scripts ${{ env.AWS_CODE_DEPLOY_NAME }}

      - name: Rename appspec-dev file to appspec
        if: dev
        run: cd ${{ env.AWS_CODE_DEPLOY_NAME }} && mv appspec-dev.yml appspec.yml

      - name: AWS Configure
        if: steps.diff.outputs.diff
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: Upload to AWS S3
        if: steps.diff.outputs.diff
        run: |
          aws deploy push \
          --application-name ${{ env.AWS_CODE_DEPLOY_NAME }} \
          --s3-location s3://${{ env.AWS_S3_BUCKET_NAME }}/codedeploy/$GITHUB_SHA.zip \
          --ignore-hidden-files \
          --source ${{ env.AWS_CODE_DEPLOY_NAME }}

      - name: Delpoy to AWS EC2
        if: steps.diff.outputs.diff
        run: |
          aws deploy create-deployment \
          --application-name ${{ env.AWS_CODE_DEPLOY_NAME }} \
          --deployment-config-name CodeDeployDefault.OneAtATime \
          --deployment-group-name ${{ env.AWS_CODE_DEPLOY_GROUP }} \
          --description "Deploy artscope frontend" \
          --s3-location bucket=$AWS_S3_BUCKET_NAME,key=codedeploy/$GITHUB_SHA.zip,bundleType=zip

      - name: Autoincrement a new minor version
        if: steps.diff.outputs.diff
        run: |
          echo "NEW_MINOR_VERSION=$((${{ secrets.MINOR }}+1))" >> $GITHUB_ENV

      - name: Update Minor version
        if: steps.diff.outputs.diff
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: 'MINOR'
          value: ${{ env.NEW_MINOR_VERSION }}
          repository: ${{ secrets.REPO }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
